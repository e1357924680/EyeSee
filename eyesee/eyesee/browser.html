<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeSee Browser</title>
<style>
  :root{--bg:#EEF2F7;--bar:#fff;--ink:#1F2A44;--line:#CBD3E1;--brand:#2B3A8F;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#151B2E;--bar:#1D2540;--ink:#E8ECF6;--line:#2C3656;--brand:#8FA2FF;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px "Segoe UI",Tahoma,system-ui,sans-serif}
  #bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #bar button,#bar select{height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;padding:0 10px;font:inherit;cursor:pointer}
  #bar button:hover{background:var(--bg)}
  #bar .go{background:var(--brand);border-color:var(--brand);color:var(--bg)}
  #addr{flex:1;min-width:180px;height:34px;border:1.5px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);color:inherit;font:inherit;direction:ltr;text-align:left}
  #addr:focus{outline:2px solid var(--brand)}
  label{display:flex;align-items:center;gap:4px;white-space:nowrap}
  #stage{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;padding:20px}
  #empty h1{margin:0;font-size:1.6rem}
  #msg{position:absolute;bottom:10px;inset-inline:10px;text-align:center;font-size:13px;opacity:.8;pointer-events:none}
</style>
</head>
<body>
  <div id="bar">
    <button id="back" title="رجوع">‹</button>
    <button id="fwd" title="للأمام">›</button>
    <button id="reload" title="تحديث">↻</button>
    <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="URL / بحث" aria-label="URL or search">
    <button class="go" id="go">فتح</button>
    <select id="src" title="لغة المصدر"></select>
    <select id="target" title="ترجم إلى"></select>
    <button id="scan" title="Alt+T">ترجمة الآن</button>
    <button id="clear">إزالة</button>
    <label><input type="checkbox" id="autoLoad"> تلقائي عند التحميل</label>
  </div>
  <div id="stage">
    <div id="empty"><h1>EyeSee Browser</h1><div>الصق رابط صفحة مانجا أو اكتب كلمات البحث في الشريط أعلاه.</div></div>
    <iframe id="frame" hidden title="page"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation"></iframe>
    <div id="msg" role="status"></div>
  </div>
  <script src="config.js"></script>
  <script src="browser.js"></script>
</body>
</html>
