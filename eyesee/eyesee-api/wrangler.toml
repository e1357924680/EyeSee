name = "eyesee-api"
main = "index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "KV"
id = "PASTE_KV_NAMESPACE_ID"      # wrangler kv namespace create KV

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"   # public key, safe here
SITE_URL = "https://YOUR-DOMAIN"               # no trailing slash
ALLOWED_ORIGINS = "https://YOUR-DOMAIN,http://localhost:8080"
STRIPE_PRICE_ID = "price_XXXXXXXX"             # the $5/month recurring price

# Secrets (never put in this file):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put JWT_SECRET             (random 32+ chars: openssl rand -hex 32)
